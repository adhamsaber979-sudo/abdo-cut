<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>ABDO CUT | عبد الرحمن</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600;800&family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@400&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: three tabs in a floating glass pill (reels, promos, ads). Each tab opens straight on its videos: one big before/after plus a grid sized to that category's video shape. */
:root {
  color-scheme: dark;
  --bg: #05082b;
  --surface: #ffffff1a;
  --glass: #ffffff1f;
  --glass-soft: #ffffff14;
  --hairline: #ffffff4d;
  --red: #7a35de;
  --red-deep: #5723c9;
  --red-bright: #9c45ff;
  --ember: #a855f7;
  --ink: #ffffff;
  --mute: #ffffffb3;
  --r-l: 28px;
  --r: 20px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --display: "Reem Kufi", "Alexandria", "Segoe UI", sans-serif;
  --body: "Alexandria", "Segoe UI", Tahoma, sans-serif;
  --latin: "Cinzel", "Times New Roman", serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); scroll-behavior: smooth; }
body {
  margin: 0; background: url('bg.avif') center / cover fixed no-repeat, var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.7;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

/* slow red haze behind everything */
.aura { display: none; position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.aura i {
  position: absolute; width: 75vmax; height: 75vmax; border-radius: 50%;
  background: radial-gradient(circle, #5723c959 0%, #5723c900 66%);
  will-change: transform; animation: drift 42s ease-in-out infinite alternate;
}
.aura i:first-child { top: -38vmax; right: -22vmax; }
.aura i:last-child { bottom: -40vmax; left: -26vmax; animation-duration: 56s; animation-direction: alternate-reverse; }
@keyframes drift { from { transform: translate3d(-5vmax, -3vmax, 0); } to { transform: translate3d(7vmax, 6vmax, 0); } }

.page { position: relative; z-index: 1; overflow-x: clip; }
.wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.inner { width: 100%; margin-inline: auto; }
@media (min-width: 1100px) { .inner { max-width: max(1040px, calc((100dvh - 150px) * 1.6875)); } }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 11px; min-height: 66px; }
.brand { display: flex; align-items: center; gap: 13px; min-width: 0; color: inherit; text-decoration: none; }

/* the logo: light comes out of the slit. A halo and slow rays around it, a cone falling on the page (behind the videos), and one glint every 7s */
.logo { position: relative; flex: none; display: block; width: 44px; height: 44px; }
.logo::before {
  content: ""; position: absolute; left: 50%; top: 60%; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, #b86bff80 0%, #a855f733 30%, #a855f700 66%); animation: halo 7s ease-in-out infinite;
}
.logo::after {
  content: ""; position: absolute; left: 50%; top: 60%; width: 180px; height: 2px; margin: -1px 0 0 -90px; border-radius: 2px; pointer-events: none;
  background: linear-gradient(90deg, #e2d2ff00, #f0e6ff, #e2d2ff00); opacity: .3; animation: flare 7s ease-in-out infinite;
}
.rays {
  position: absolute; left: 50%; top: 60%; width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 50%; pointer-events: none;
  background: repeating-conic-gradient(from 0deg, #b86bff00 0deg, #b86bff40 7deg, #b86bff00 15deg, #b86bff00 51deg);
  -webkit-mask-image: radial-gradient(circle, #000000 10%, #00000000 68%); mask-image: radial-gradient(circle, #000000 10%, #00000000 68%);
  animation: spin 50s linear infinite;
}
.beam {
  position: absolute; left: 50%; top: 60%; width: min(560px, 130vw); height: min(66vh, 580px); pointer-events: none; transform: translateX(-50%); transform-origin: 50% 0;
  background: conic-gradient(from 155deg at 50% 0, #b86bff00 0deg, #b86bff59 25deg, #b86bff00 50deg, #b86bff00 360deg);
  -webkit-mask-image: linear-gradient(to bottom, #000000, #00000000 90%); mask-image: linear-gradient(to bottom, #000000, #00000000 90%);
  filter: blur(6px); opacity: .8; animation: beam-sway 11s ease-in-out infinite alternate, beam-pulse 7s ease-in-out infinite;
}
@keyframes halo { 0%, 100% { opacity: .7; transform: scale(1); } 50% { opacity: .85; transform: scale(1.06); } 76% { opacity: 1; transform: scale(1.2); } }
@keyframes flare { 0%, 64%, 90%, 100% { opacity: .22; transform: scaleX(.7); } 76% { opacity: 1; transform: scaleX(1.25); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes beam-sway { from { transform: translateX(-50%) rotate(-4deg); } to { transform: translateX(-50%) rotate(4deg); } }
@keyframes beam-pulse { 0%, 100% { opacity: .7; } 50% { opacity: .85; } 76% { opacity: 1; } }
.mark { position: relative; z-index: 1; display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 6px #a855f78c); }
.mark path { stroke-width: 1.4; stroke-linejoin: round; }
.mark .slit { fill: #b86bff; stroke: #b86bff; transform-origin: 32px 40px; filter: drop-shadow(0 0 5px #b86bff); animation: slit-open 1.1s var(--ease) both, slit-breathe 7s ease-in-out 1.1s infinite; }
.mark .slit-core { fill: #f3eaff; stroke: none; }
.mark .shine { animation: glint 7s ease-in-out infinite; }
@keyframes slit-open { from { transform: scaleY(.15); } to { transform: scaleY(1); } }
@keyframes slit-breathe { 0%, 100% { filter: drop-shadow(0 0 4px #b86bff); } 50% { filter: drop-shadow(0 0 9px #b86bff); } 76% { filter: drop-shadow(0 0 18px #d9c0ff); } }
@keyframes glint { 0%, 62% { transform: translateX(0) skewX(-20deg); } 86%, 100% { transform: translateX(-130px) skewX(-20deg); } }
.names { position: relative; z-index: 1; display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.names b {
  font-family: var(--latin); font-weight: 700; font-size: 14px; letter-spacing: .15em; direction: ltr; text-align: start;
  background: linear-gradient(100deg, var(--ink) 38%, #e2d2ff 47%, #ffffff 50%, #e2d2ff 53%, var(--ink) 62%) 0 0 / 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 7px #a855f766); animation: word-glint 7s ease-in-out infinite;
}
@keyframes word-glint { 0%, 68% { background-position: 0% 0; } 92%, 100% { background-position: 100% 0; } }
.names span { font-family: var(--display); font-size: 12px; color: var(--mute); }
.pill-btn {
  flex: none; display: inline-block; border-radius: 999px; padding: 9px 20px; color: var(--ink); text-decoration: none;
  font-weight: 600; font-size: 13px; line-height: 1.4;
  background: var(--glass); border: 1px solid var(--hairline); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  transition: background .4s var(--ease), transform .4s var(--ease), box-shadow .4s var(--ease);
}
.pill-btn:hover { background: var(--red); transform: translateY(-2px); box-shadow: 0 10px 26px -10px #9c45ffcc; }
.pill-btn.solid { background: linear-gradient(180deg, var(--red-bright), var(--red-deep)); border-color: #ffffff1f; box-shadow: inset 0 1px 0 #ffffff26; }
.pill-btn.solid:hover { box-shadow: inset 0 1px 0 #ffffff26, 0 10px 26px -10px #9c45ffcc; }

/* tabs */
.tabs {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 6;
  display: flex; gap: 2px; width: 100%; padding: 5px; margin-bottom: 18px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--hairline); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3);
  box-shadow: 0 14px 44px -14px #000000d9;
}
.tabs button {
  position: relative; z-index: 1; flex: 1; border: 0; background: none; color: var(--mute); cursor: pointer;
  font: inherit; font-weight: 600; font-size: 14px; line-height: 1.4; padding: 9px 22px; border-radius: 999px; transition: color .35s var(--ease);
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.tab-ind {
  position: absolute; top: 5px; bottom: 5px; left: 0; width: 0; border-radius: 999px;
  background: linear-gradient(180deg, var(--red-bright), var(--red-deep));
  box-shadow: inset 0 1px 0 #ffffff29, 0 8px 22px -8px #9c45ffcc;
}
.tabs.ready .tab-ind { transition: transform .55s var(--ease), width .55s var(--ease); }
@media (max-width: 899px) { .tabs button { padding: 9px 4px; font-size: 13px; } }
@media (min-width: 900px) {
  .tabs { width: fit-content; margin: -58px auto 26px; }
  .tabs button { flex: none; min-width: 104px; }
}

/* one category */
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding-bottom: 16px; }
.panel-title { min-width: 0; }
h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(23px, 3vw, 30px); line-height: 1.25; text-wrap: balance; }
.panel-title p { margin: 2px 0 0; color: var(--mute); font-size: 13px; }
.offer { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.price {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 8px 16px; border-radius: 999px; line-height: 1.4;
  background: var(--glass); border: 1px solid var(--hairline); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
}
.price b { font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.price span { font-size: 12px; color: var(--mute); }
.price.pending { border: 1px dashed #a855f773; background: none; color: var(--mute); font-size: 13px; }

.grid { display: grid; gap: 10px; }
.grid.r916 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.r169 { grid-template-columns: minmax(0, 1fr); }
.grid.r45, .grid.r11, .grid.trio { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.solo { grid-template-columns: minmax(0, 1fr); }
.grid.r916 .big, .grid.r45 .big, .grid.r11 .big, .grid.trio .big { grid-column: span 2; }
.big { width: 100%; aspect-ratio: var(--ratio); }
@media (min-width: 700px) {
  .grid.r916, .grid.r45, .grid.r11 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid.r169, .grid.trio { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .big, .grid.r916 .big, .grid.r45 .big, .grid.r11 .big, .grid.r169 .big, .grid.trio .big { grid-column: span 2; grid-row: span 2; aspect-ratio: auto; height: 100%; }
  .grid.solo .big { grid-column: auto; grid-row: auto; aspect-ratio: var(--ratio); height: auto; }
  /* tabs with few videos keep the first screen: the panel narrows so the big video still fits the height */
  .fit-trio { max-width: max(600px, calc((100dvh - 190px) * .844)); margin-inline: auto; }
  .fit-solo { max-width: max(340px, calc((100dvh - 190px) * .5625)); margin-inline: auto; }
}
@media (min-width: 1100px) { .grid.r916 { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.panel-body { padding-bottom: 60px; }
@media (min-width: 1100px) { .fit-r45 { max-width: max(860px, calc((100dvh - 190px) * 1.6)); margin-inline: auto; } }

/* the card that closes a tab: it fills the grid's last place and turns watching into asking */
.invite {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; aspect-ratio: var(--ratio); padding: 14px; text-align: center; text-decoration: none; color: var(--ink);
  border-radius: var(--r); border: 1px solid #a855f759; background: radial-gradient(circle at 50% 35%, #5723c9, #0f0c3d 72%); box-shadow: 0 24px 48px -30px #9c45ff;
  transition: transform .6s var(--ease), box-shadow .6s var(--ease);
}
.invite:only-child { grid-column: 1 / -1; justify-self: center; width: 100%; max-width: 380px; min-height: 280px; }
.invite:hover { transform: translateY(-5px); box-shadow: 0 28px 54px -22px #9c45ffcc; }
.invite b { font-family: var(--display); font-weight: 700; font-size: clamp(17px, 1.6vw, 22px); line-height: 1.35; text-wrap: balance; }
.invite .pill-btn { padding: 8px 16px; }

/* video card */
.tile {
  position: relative; display: block; width: 100%; aspect-ratio: var(--ratio); padding: 0; border: 0; border-radius: var(--r);
  background: var(--surface); color: inherit; font: inherit; text-align: start; cursor: pointer; overflow: hidden; isolation: isolate;
  box-shadow: 0 16px 40px -28px #000000; transition: transform .6s var(--ease), box-shadow .6s var(--ease);
}
.tile canvas, .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.tile::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 0 0 1px #ffffff14; transition: box-shadow .5s var(--ease);
}
.tile:hover { transform: translateY(-5px); box-shadow: 0 24px 48px -22px #9c45ffb3; }
.tile:hover::after { box-shadow: inset 0 0 0 1px #a855f78c; }
.tile:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
.tile-meta {
  position: absolute; inset: auto 0 0 0; padding: 44px 12px 11px; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; line-height: 1.35;
  background: linear-gradient(to top, #05082bd9, #05082b00);
}
.tile-text { display: flex; flex-direction: column; min-width: 0; }
.tile-text b { font-weight: 600; font-size: 13.5px; }
.tile-text span { font-size: 11px; color: var(--mute); }
.play {
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: #ffffff1f; border: 1px solid #ffffff26; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  transition: background .4s var(--ease), transform .4s var(--ease);
}
.play svg { width: 11px; height: 11px; fill: var(--ink); transform: scaleX(-1); }
.tile:hover .play { background: var(--red-bright); transform: scale(1.1); }
.demo-tag {
  position: absolute; top: 9px; inset-inline-end: 9px; font-size: 10px; line-height: 1.5; color: var(--ink); padding: 2px 9px; border-radius: 999px;
  background: var(--glass-soft); border: 1px solid #ffffff1a;
}

/* before / after */
.compare {
  position: relative; overflow: hidden; isolation: isolate; background: var(--surface); --pos: 50%; border-radius: var(--r);
  touch-action: pan-y; cursor: ew-resize; user-select: none; -webkit-user-select: none; direction: ltr; min-height: 0;
  box-shadow: 0 20px 50px -30px #000000;
}
.compare.big { border-radius: var(--r-l); box-shadow: 0 30px 70px -36px #9c45ff99; }
.compare::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1px #ffffff14; }
.compare canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.compare .rule {
  position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; margin-left: -1px; pointer-events: none;
  background: linear-gradient(to bottom, #f8f7ff00, #f8f7ff 16%, #f8f7ff 84%, #f8f7ff00); box-shadow: 0 0 16px #a855f7;
}
.compare .knob {
  position: absolute; top: 50%; left: var(--pos); width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; pointer-events: none;
  display: grid; place-items: center; background: #1b235cb3; border: 1px solid #ffffff4d;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 8px 26px -6px #000000, 0 0 22px -6px var(--ember);
  transition: transform .4s var(--ease);
}
.compare:hover .knob { transform: scale(1.08); }
.compare .knob svg { width: 22px; height: 22px; fill: var(--ink); }
.compare input[type=range] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.compare input[type=range]:focus-visible ~ .knob { outline: 3px solid var(--ember); outline-offset: 3px; }
.side {
  position: absolute; top: 12px; font-weight: 600; font-size: 12px; line-height: 1.5; padding: 3px 13px; border-radius: 999px; pointer-events: none; direction: rtl;
  background: var(--glass-soft); border: 1px solid #ffffff1a; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
}
.side.after { left: 12px; background: #7a35ded9; }
.side.before { right: 12px; }
.compare-foot {
  position: absolute; inset: auto 0 0 0; padding: 48px 14px 12px; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px;
  direction: rtl; pointer-events: none; background: linear-gradient(to top, #05082bd9, #05082b00); line-height: 1.35;
}
.compare-foot > div { display: flex; flex-direction: column; min-width: 0; }
.compare-foot b { font-weight: 600; font-size: 15px; }
.compare-foot span { font-size: 11px; color: var(--mute); }
.foot-end { display: flex; align-items: center; gap: 10px; flex: none; }
.tc { font-family: var(--mono); font-size: 11px; color: var(--mute); direction: ltr; font-variant-numeric: tabular-nums; }
.watch {
  pointer-events: auto; flex: none; border-radius: 999px; border: 1px solid #ffffff2e; background: #ffffff1a; color: var(--ink); cursor: pointer;
  font: inherit; font-size: 12px; font-weight: 600; line-height: 1.4; padding: 7px 14px; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  transition: background .4s var(--ease), color .4s var(--ease);
}
.watch:hover { background: var(--ink); color: var(--bg); }

.pairs-block { padding-top: 44px; }
.pairs-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; padding-bottom: 14px; }
.pairs-head p { margin: 0; color: var(--mute); font-size: 13px; }
.pairs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.pairs.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pairs.even .side { top: 8px; font-size: 11px; padding: 2px 9px; }
.pairs.even .side.after { left: 8px; }
.pairs.even .side.before { right: 8px; }
.pairs.even .compare-foot { padding: 34px 8px 8px; }
@media (max-width: 699px) { .pairs.even .compare .knob { width: 36px; height: 36px; margin: -18px 0 0 -18px; } }
@media (min-width: 700px) { .pairs, .pairs.even { grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); } }
.pairs .compare { aspect-ratio: var(--ratio); max-width: 100%; }

/* tab change */
.enter .tile, .enter .compare, .enter .panel-head { animation: rise .75s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } }

/* from raw to final: a small editing timeline the client scrubs */
.journey { padding-block: 8px 64px; }
.journey-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.j-preview {
  position: relative; height: min(46vh, 400px); aspect-ratio: 9 / 16; max-width: 100%; margin-inline: auto; overflow: hidden; isolation: isolate;
  border-radius: var(--r-l); background: var(--surface); box-shadow: 0 30px 70px -36px #9c45ff99;
}
.j-preview::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1px #ffffff14; }
.j-preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.j-chip {
  position: absolute; top: 10px; inset-inline-start: 10px; font-size: 11px; font-weight: 600; line-height: 1.5; padding: 2px 10px; border-radius: 999px;
  background: #7a35ded9; border: 1px solid #ffffff1f;
}
.j-side { min-width: 0; display: flex; flex-direction: column; }
.j-hint { margin: 2px 0 0; color: var(--mute); font-size: 13px; }
.j-now { min-height: 92px; padding-block: 12px; }
.j-now b { display: block; font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.3; color: #e2d2ff; }
.j-now p { margin: 2px 0 0; font-size: 14px; max-width: 54ch; }
.timeline {
  position: relative; direction: ltr; padding: 10px 14px 14px; border-radius: var(--r); cursor: ew-resize; user-select: none; -webkit-user-select: none; touch-action: pan-y;
  background: var(--glass); border: 1px solid var(--hairline); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); box-shadow: 0 24px 60px -36px #000000;
}
.timeline input[type=range] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.tl-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 6px; }
.tl-head .tc { font-size: 13px; color: var(--ink); }
.tl-count { font-size: 12px; color: var(--mute); direction: rtl; }
.tl-body { position: relative; padding-top: 14px; }
.tl-ruler {
  position: absolute; inset: 0 0 auto; height: 10px;
  background: repeating-linear-gradient(90deg, #ffffff2e 0 1px, #ffffff00 1px 10%);
  -webkit-mask-image: linear-gradient(to bottom, #000000, #00000000); mask-image: linear-gradient(to bottom, #000000, #00000000);
}
.track { position: relative; height: 32px; margin-top: 5px; border-radius: 10px; background: #ffffff08; }
.clip {
  position: absolute; top: 0; bottom: 0; left: var(--start); right: 0; display: flex; align-items: center; gap: 8px; padding-inline: 10px; overflow: hidden; direction: ltr;

      isHovering = true;
      updateAudio();
      dragging = true;
      try { el.setPointerCapture(e.pointerId); } catch (x) {}
      at(e);
    });
    el.addEventListener('pointermove', function (e) { if (dragging) { at(e); } });
    ['pointerup', 'pointercancel'].forEach(function (n) { el.addEventListener(n, function () { dragging = false; }); });
    view.range.addEventListener('input', function () { setPos(view, Number(view.range.value)); });
    var watch = el.querySelector('.watch');
    if (watch) { watch.addEventListener('click', function () { var w = watchTarget(cat, item); openTheater(w.list, w.index); }); }
  }
  /* a real before/after opens the finished video it came from, inside the tab's list when it is there */
  function watchTarget(cat, item) {
    var i = cat.list.indexOf(item); if (i >= 0) { return { list: cat.list, index: i }; }
    for (var k = 0; k < cat.list.length; k++) { if (cat.list[k].full && cat.list[k].full === item.full) { return { list: cat.list, index: k }; } }
    return { list: [item], index: 0 };
  }
  function buildTile(item, cat, parent, index, big) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'tile' + (big ? ' big' : ''); b.setAttribute('aria-label', item.title ? 'شغّل ' + item.title : 'شغّل الفيديو ' + (index + 1)); b.style.setProperty('--i', index); b.style.setProperty('--ratio', item.ratio);
    b.innerHTML = (item.src ? '<video muted loop playsinline preload="none"></video>' : '<canvas></canvas>') + (item.demo ? '<span class="demo-tag">مثال</span>' : '') + '<span class="tile-meta"><span class="tile-text"><b></b><span></span></span>' + PLAY + '</span>';
    b.querySelector('b').textContent = item.title || ''; b.querySelector('.tile-text span').textContent = item.type || '';
    b.addEventListener('click', function () { openTheater(cat.list, cat.list.indexOf(item)); });
    parent.appendChild(b);
    if (item.src) {
      /* the loop only starts loading when the card reaches the screen; until then the cover image shows */
      var v = b.querySelector('video'); v.muted = true; if (item.poster) { v.poster = item.poster; }
      if (AUTOPLAY) {
        var rec = { video: v, on: false }; loops.push(rec);
        new IntersectionObserver(function (en) {
          rec.on = en[0].isIntersecting;
          if (rec.on) { if (!v.src) { v.src = item.src; } if (!dlg.open) { v.play().catch(function () {}); } } else { v.pause(); }
        }, { rootMargin: '80px' }).observe(b);
      }
    } else {
      addView(b.querySelector('canvas'), item, 'tile');
    }
  }

  /* theater */
  var dlg = document.getElementById('theater'), tCanvas = document.getElementById('t-canvas'), tVideo = document.getElementById('t-video'), tBar = document.getElementById('t-bar'), stage = document.getElementById('stage');
  var tView = null, tList = [], tIdx = 0;
  /* only one video plays at a time: the loops behind the player rest until it closes */
  function restLoops() {
    loops.forEach(function (r) { r.video.pause(); });
    views.forEach(function (x) {
      if (x.video) { x.video.pause(); x.video.muted = true; }
      if (x.videoBefore) { x.videoBefore.pause(); x.videoBefore.muted = true; }
      if (x.videoAfter) { x.videoAfter.pause(); x.videoAfter.muted = true; }
    });
  }
  function wakeLoops() {
    loops.forEach(function (r) { if (r.on) { r.video.play().catch(function () {}); } });
    views.forEach(function (x) { if (x.video && x.visible) { x.video.play().catch(function () {}); } });
  }
  function openTheater(list, i) { tList = list; showTheater(i); if (!dlg.open) { dlg.showModal(); document.documentElement.style.overflow = 'hidden'; restLoops(); } }
  function closeTheater() {
    if (!dlg.open || dlg.classList.contains('closing')) { return; }
    dlg.classList.add('closing');
    setTimeout(function () { dlg.classList.remove('closing'); dlg.close(); }, REDUCED ? 0 : 180);
  }
  function showTheater(i) {
    tIdx = (i + tList.length) % tList.length; var item = tList[tIdx], parts = item.ratio.split('/');
    stage.style.setProperty('--r', Number(parts[0]) / Number(parts[1]));
    document.getElementById('t-title').textContent = item.title || '';
    document.getElementById('t-type').textContent = (item.type || '') + (item.demo ? ' · مثال من غير صوت' : '');
    tBar.hidden = !!item.src;
    if (item.src) {
      tCanvas.hidden = true; tVideo.hidden = false; tVideo.src = item.full || item.src; tVideo.muted = false; tVideo.play().catch(function () {});
    } else {
      tVideo.pause(); tVideo.removeAttribute('src'); tVideo.hidden = true; tCanvas.hidden = false;
      if (!tView) { tView = addView(tCanvas, item, 'theater', { tc: document.getElementById('t-tc') }); } else { tView.item = item; }
      if (dlg.open && !REDUCED) { tCanvas.animate([{ opacity: .35 }, { opacity: 1 }], { duration: 380, easing: 'ease-out' }); }
    }
    document.getElementById('t-prev').hidden = document.getElementById('t-next').hidden = tList.length < 2;
  }
  document.getElementById('t-close').addEventListener('click', closeTheater);
  document.getElementById('t-next').addEventListener('click', function () { showTheater(tIdx + 1); });
  document.getElementById('t-prev').addEventListener('click', function () { showTheater(tIdx - 1); });
  dlg.addEventListener('cancel', function (e) { e.preventDefault(); closeTheater(); });
  dlg.addEventListener('close', function () { tVideo.pause(); tVideo.removeAttribute('src'); tVideo.load(); document.documentElement.style.overflow = ''; wakeLoops(); });
  dlg.addEventListener('click', function (e) { if (e.target.classList.contains('theater')) { closeTheater(); } });
  dlg.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft') { showTheater(tIdx + 1); } if (e.key === 'ArrowRight') { showTheater(tIdx - 1); } });
  var swipe = null;
  stage.addEventListener('pointerdown', function (e) { swipe = e.clientX; });
  stage.addEventListener('pointerup', function (e) { if (swipe === null) { return; } var d = e.clientX - swipe; swipe = null; if (Math.abs(d) > 50) { showTheater(tIdx + (d > 0 ? 1 : -1)); } });

  function orderLink(text) {
    return CONTACT.whatsapp ? 'https://wa.me/' + CONTACT.whatsapp + '?text=' + encodeURIComponent(text) : '#contact';
  }

  /* build the tabs and their panels */
  var tabsEl = document.getElementById('tabs'), ind = document.getElementById('tab-ind'), panelsEl = document.getElementById('panels');
  var current = null;

  function moveInd(cat) { if (!cat || !cat.tab) return; ind.style.width = cat.tab.offsetWidth + 'px'; ind.style.transform = 'translateX(' + cat.tab.offsetLeft + 'px)'; }

  function selectTab(id, byUser) {
    var cat = CATEGORIES.filter(function (x) { return x.id === id; })[0] || CATEGORIES[0];
    if (current === cat) { return; }
    CATEGORIES.forEach(function (x) {
      if (!x.panel || !x.tab) return;
      var on = x === cat; x.panel.hidden = !on; x.tab.setAttribute('aria-selected', on ? 'true' : 'false'); x.tab.tabIndex = on ? 0 : -1;
    });
    current = cat; moveInd(cat);
    if (cat.panel) {
      cat.panel.classList.remove('enter'); void cat.panel.offsetWidth; cat.panel.classList.add('enter');
      if (byUser) {
        try { history.replaceState(null, '', '#' + cat.id); } catch (e) {}
        var y = cat.panel.getBoundingClientRect().top + scrollY - 76;
        if (scrollY > y) { scrollTo({ top: y, behavior: REDUCED ? 'auto' : 'smooth' }); }
      }
    }
  }

  function buildPanels() {
    tabsEl.innerHTML = '<span class="tab-ind" id="tab-ind" aria-hidden="true"></span>';
    ind = document.getElementById('tab-ind');
    panelsEl.innerHTML = '';

    CATEGORIES.forEach(function (cat) {
      cat.work = cat.work || [];
      cat.pairs = cat.pairs || [];
      var all = (cat.big ? [cat.big] : []).concat(cat.work, cat.pairs);
      all.forEach(function (x) { if (x) x.ratio = x.ratio || cat.ratio; });
      if (cat.big && !cat.big.plain) { cat.big.isCompare = true; }
      cat.pairs.forEach(function (x) { x.isCompare = true; });
      /* the player steps through finished videos; a real before/after is only an excerpt of one of them */
      cat.list = all.filter(function (x) { return x && !(x.isCompare && x.src); });

      var tab = document.createElement('button'); tab.type = 'button'; tab.id = 'tab-' + cat.id; tab.setAttribute('role', 'tab'); tab.setAttribute('aria-controls', 'panel-' + cat.id); tab.textContent = cat.tab || cat.name;
      tab.addEventListener('click', function () { selectTab(cat.id, true); });
      tabsEl.appendChild(tab); cat.tab = tab;

      var panel = document.createElement('section'); panel.id = 'panel-' + cat.id; panel.className = 'panel-body' + (cat.fit ? ' fit-' + cat.fit : ''); panel.setAttribute('role', 'tabpanel'); panel.setAttribute('aria-labelledby', tab.id); panel.hidden = true;
      var head = document.createElement('div'); head.className = 'panel-head';
      head.innerHTML = '<div class="panel-title"><h2></h2><p></p></div><div class="offer"></div>';
      head.querySelector('h2').textContent = cat.name; head.querySelector('p').textContent = cat.about;
      var offer = head.querySelector('.offer'), price = document.createElement('span');
      if (cat.price) {
        price.className = 'price'; var pb = document.createElement('b'), ps = document.createElement('span'); pb.textContent = cat.price; ps.textContent = cat.per; price.appendChild(pb); price.appendChild(ps);
      } else {
        price.className = 'price pending'; price.textContent = 'السعر هيتحدد';
      }
      var order = document.createElement('a'); order.className = 'pill-btn solid'; order.textContent = cat.order; order.href = orderLink(cat.orderText);
      if (CONTACT.whatsapp) { order.target = '_blank'; order.rel = 'noopener'; }
      offer.appendChild(price); offer.appendChild(order);
      panel.appendChild(head);

      var grid = document.createElement('div'); grid.className = 'grid ' + cat.layout; panel.appendChild(grid);
      panelsEl.appendChild(panel); cat.panel = panel;
      if (cat.big) {
        if (cat.big.plain) { buildTile(cat.big, cat, grid, 0, true); } else { buildCompare(cat.big, cat, grid, true, 0); }
      }
      cat.work.forEach(function (item, i) { buildTile(item, cat, grid, i + 1); });
      if (cat.invite) {
        var inv = document.createElement('a'); inv.className = 'invite'; inv.style.setProperty('--ratio', cat.ratio); inv.style.setProperty('--i', cat.work.length + 1); inv.href = orderLink(cat.orderText);
        if (CONTACT.whatsapp) { inv.target = '_blank'; inv.rel = 'noopener'; }
        var invTitle = document.createElement('b'); invTitle.textContent = cat.invite; var invBtn = document.createElement('span'); invBtn.className = 'pill-btn solid'; invBtn.textContent = cat.order;
        inv.appendChild(invTitle); inv.appendChild(invBtn); grid.appendChild(inv);
      }

      if (cat.pairs.length) {
        var block = document.createElement('div'); block.className = 'pairs-block';
        block.innerHTML = '<div class="pairs-head"><h2>قبل وبعد</h2><p>اسحب الخط وشوف الفرق بنفسك.</p></div><div class="pairs"></div>';
        panel.appendChild(block);
        var pairsGrid = block.querySelector('.pairs'); pairsGrid.style.setProperty('--n', cat.pairs.length); pairsGrid.classList.toggle('even', cat.pairs.length % 2 === 0);
        cat.pairs.forEach(function (item, i) { buildCompare(item, cat, pairsGrid, false, i); });
      }
    });

    selectTab((location.hash || '').slice(1));
    requestAnimationFrame(function () { requestAnimationFrame(function () { tabsEl.classList.add('ready'); moveInd(current); }); });
  }

  async function loadMediaAndBuild() {
    try {
      var res = await fetch('/api/media', { cache: 'no-store' });
      if (res.ok) {
        var rows = await res.json();
        if (Array.isArray(rows) && rows.length) {
          var catMap = {};
          CATEGORIES.forEach(function (c) { catMap[c.id] = c; c.work = []; c.pairs = []; });

          var groups = {};
          rows.forEach(function (r) {
            var k = r.group_id || r.id;
            if (!groups[k]) groups[k] = [];
            groups[k].push(r);
          });

          Object.keys(groups).forEach(function (k) {
            var items = groups[k];
            var first = items[0];
            var targetCat = catMap[first.category] || catMap['reels'];

            if (items.length > 1 || first.role === 'before' || first.role === 'after' || first.category === 'before_after') {
              var beforeItem = items.find(function (x) { return x.role === 'before'; }) || items[0];
              var afterItem = items.find(function (x) { return x.role === 'after'; }) || items[1] || items[0];

              var pairObj = {
                isCompare: true,
                src: afterItem.video_url,
                full: afterItem.video_url,
                poster: afterItem.poster_url,
                before_url: beforeItem.video_url,
                after_url: afterItem.video_url,
                before_poster: beforeItem.poster_url,
                after_poster: afterItem.poster_url,
                ratio: afterItem.ratio || targetCat.ratio
              };
              targetCat.pairs.push(pairObj);
            } else if (first.category === 'intro') {
              targetCat.big = {
                plain: true,
                src: first.video_url,
                full: first.video_url,
                poster: first.poster_url,
                ratio: first.ratio || targetCat.ratio
              };
            } else {
              targetCat.work.push({
                src: first.video_url,
                full: first.video_url,
                poster: first.poster_url,
                ratio: first.ratio || targetCat.ratio
              });
            }
          });
        }
      }
    } catch (e) {
      console.warn('Could not load live media:', e);
    }
    buildPanels();
  }

  loadMediaAndBuild();

  tabsEl.addEventListener('keydown', function (e) {
    var i = CATEGORIES.indexOf(current), n = CATEGORIES.length, to = null;
    if (e.key === 'ArrowLeft') { to = (i + 1) % n; }
    if (e.key === 'ArrowRight') { to = (i - 1 + n) % n; }
    if (e.key === 'Home') { to = 0; }
    if (e.key === 'End') { to = n - 1; }
    if (to === null) { return; }
    e.preventDefault(); selectTab(CATEGORIES[to].id, true); if (CATEGORIES[to].tab) CATEGORIES[to].tab.focus();
  });
  addEventListener('hashchange', function () { var id = (location.hash || '').slice(1); if (CATEGORIES.some(function (x) { return x.id === id; })) { selectTab(id, true); } });
  addEventListener('resize', function () { moveInd(current); });
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function () { moveInd(current); }); }

  (function buildJourney() {
    var tracks = document.getElementById('tl-tracks'), body = document.getElementById('tl-body'), clips = [];
    STAGES.forEach(function (st) {
      var track = document.createElement('div'); track.className = 'track';
      var clip = document.createElement('div'); clip.className = 'clip'; clip.style.setProperty('--start', st.start + '%'); clip.textContent = st.name;
      if (st.wave) {
        var w = document.createElement('span'); w.className = 'wave'; w.setAttribute('aria-hidden', 'true');
        for (var i = 0; i < 30; i++) { var bar = document.createElement('i'); bar.style.setProperty('--h', (.2 + .8 * hash(i + 90)).toFixed(2)); bar.style.setProperty('--d', (hash(i + 7) * -1.1).toFixed(2) + 's'); w.appendChild(bar); }
        clip.appendChild(w);
      }
      track.appendChild(clip); tracks.appendChild(track); clips.push(clip);
    });
    var timeline = document.getElementById('timeline'), range = document.getElementById('j-range');
    var view = addView(document.getElementById('j-canvas'), JOURNEY_ITEM, 'journey', {
      pos: REDUCED ? 100 : 0, target: 0, stage: 0, prev: 0,
      dom: { timeline: timeline, range: range, clips: clips, tc: document.getElementById('j-tc'), count: document.getElementById('j-count'), name: document.getElementById('j-name'), note: document.getElementById('j-note'), chip: document.getElementById('j-chip'), now: document.querySelector('.j-now') }
    });
    applyJourney(view);
    function setJourney(pos) {
      view.target = Math.max(0, Math.min(100, pos)); view.touched = true; range.value = Math.round(view.target);
      if (REDUCED) { view.pos = view.target; applyJourney(view); paint(view, 1.5); }
    }
    function at(e) { var r = body.getBoundingClientRect(); setJourney((e.clientX - r.left) / r.width * 100); }
    var dragging = false;
    timeline.addEventListener('pointerdown', function (e) { dragging = true; try { timeline.setPointerCapture(e.pointerId); } catch (x) {} at(e); });
    timeline.addEventListener('pointermove', function (e) { if (dragging) { at(e); } });
    ['pointerup', 'pointercancel'].forEach(function (n) { timeline.addEventListener(n, function () { dragging = false; }); });
    range.addEventListener('input', function () { setJourney(Number(range.value)); });
  }());

  var action = document.getElementById('contact-action'), floatTalk = document.getElementById('float-talk');
  if (CONTACT.whatsapp) {
    var url = 'https://wa.me/' + CONTACT.whatsapp;
    action.innerHTML = '<div class="contact-stack"><a class="pill-btn solid" target="_blank" rel="noopener" href="' + url + '">ابعتلي على واتساب</a>' + (CONTACT.phone ? '<span class="phone">' + CONTACT.phone + '</span>' : '') + '</div>';
    floatTalk.href = url; floatTalk.target = '_blank'; floatTalk.rel = 'noopener'; floatTalk.hidden = false;
  } else {
    action.innerHTML = '<div class="pending-contact">رقم الواتساب هيتضاف هنا قبل ما اللينك يتبعت للعملاء.</div>';
  }
  document.getElementById('demo-note').hidden = !CATEGORIES.some(function (cat) { return (cat.big ? [cat.big] : []).concat(cat.work || [], cat.pairs || []).some(function (x) { return x && x.demo; }); });

  if (REDUCED) { views.forEach(function (v) { paint(v, 1.5); }); } else { requestAnimationFrame(loop); }
}());
</script>
